<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Опрос — точки карты Пыли (~7)</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --card: #1a1d24; --text: #f2f3f5; --muted: #9aa3b2;
    --line: #2a303b; --accent: #5b8cff; --accent-press: #3d6fe0; --ok: #3d9a6a;
    --ctx: #2a3344; --pad: max(16px, env(safe-area-inset-left));
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --card: #fff; --text: #14171c; --muted: #667085;
      --line: #e4e7ec; --accent: #2563eb; --accent-press: #1d4ed8;
      --ok: #15803d; --ctx: #eef2f8;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45; }
  main { max-width: 680px; margin: 0 auto; padding: 20px var(--pad) 130px; }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
  .locked { background: var(--ctx); border-radius: 12px; padding: 10px 12px;
    font-size: 0.85rem; color: var(--muted); margin: 0 0 16px; }
  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 0; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin: 0 0 14px; }
  section h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0 0 10px; }
  .q { padding: 14px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 0; }
  .q .title { display: block; font-weight: 600; margin-bottom: 6px; }
  .ctx { background: var(--ctx); border-radius: 10px; padding: 10px 12px;
    font-size: 0.84rem; color: var(--muted); margin: 0 0 10px; white-space: pre-wrap; }
  .rec { font-size: 0.8rem; color: var(--accent); margin: -4px 0 8px; }
  select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    -webkit-appearance: none; appearance: none;
  }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
    background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  textarea.note { margin-top: 8px; display: none; }
  textarea.note.show { display: block; }
  .footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  }
  .footer-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; }
  button {
    flex: 1; border: 0; border-radius: 12px; padding: 14px 12px; font: inherit;
    font-weight: 600; color: #fff; background: var(--accent);
  }
  button:active { background: var(--accent-press); }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #toast {
    display: none; position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--ok); color: #fff; padding: 10px 14px; border-radius: 999px;
    font-size: 0.9rem; z-index: 20; white-space: nowrap;
  }
  #out {
    display: none; white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; font-size: 0.85rem; margin-top: 12px;
  }
  #out.show { display: block; }
</style>
</head>
<body>
<main>
  <h1>Опрос — точки карты Пыли</h1>
  <p class="lead">Парение v3 оставляем. Нужно ~7 подписей. Выбери → «Скопировать» → в чат.</p>
  <div class="locked"><b>Уже 3:</b> Небесный Форт · Звёздный Причал · Разлом. Нужно ещё ~4.</div>

  <div class="progress">
    <div class="bar"><span id="bar"></span></div>
    <div class="meta"><span id="count">0 / 0</span><span>на устройстве</span></div>
  </div>
  <div id="sections"></div>

  <section>
    <h2>Свободный текст</h2>
    <p class="hint">Правки имён пакета / свой список 4 точек.</p>
    <textarea id="freeform" rows="5" placeholder="note=…"></textarea>
  </section>
  <pre id="out"></pre>
</main>

<div class="footer">
  <div class="footer-inner">
    <button type="button" class="secondary" id="btnLitter">Litterbox ответов</button>
    <button type="button" id="btnCopy">Скопировать ответы</button>
  </div>
</div>
<div id="toast">Скопировано</div>

<script>
const STORAGE = "echo-dawn-mq06-dust-map-points-v1";
const QUESTIONS = [
  {
    id: "a",
    section: "A · Быстрый пакет",
    title: "Взять пакет из 4 точек?",
    ctx: "4) Верфь Эфира — воздушные верфи\n5) Кузня Оболочек — конструкты\n6) Хор Разума — цитадель свежевателей\n7) Осколок Востока — город на отдельном куске подъёма",
    rec: "Рекомендация: a_pack1 → сразу v4.",
    options: [
      { v: "a_pack1", t: "Пакет как есть" },
      { v: "a_pack1_edit", t: "Роли ок — правлю имена ниже" },
      { v: "a_pick", t: "Не пакет — отвечу B–E" },
      { v: "a_other", t: "Свой список 4 точек → ниже" }
    ]
  },
  {
    id: "b",
    section: "B–E · Слоты (если не пакет)",
    title: "Слот 4 — воздух / флот",
    ctx: "Можно пропустить, если выбрал пакет A.",
    options: [
      { v: "b_skip", t: "— пропуск (взял пакет) —" },
      { v: "b1", t: "Верфь Эфира — воздушные верфи" },
      { v: "b2", t: "Док Бури — военная авиабаза" },
      { v: "b3", t: "Реле Подъёма — вторая станция лучей" },
      { v: "b_other", t: "Своё → ниже" }
    ]
  },
  {
    id: "c",
    section: "B–E · Слоты (если не пакет)",
    title: "Слот 5 — техномагия",
    options: [
      { v: "c_skip", t: "— пропуск (взял пакет) —" },
      { v: "c1", t: "Кузня Оболочек — конструкты" },
      { v: "c2", t: "Литейная Искры — изделия" },
      { v: "c3", t: "Полигон Шестерён — испытания" },
      { v: "c_other", t: "Своё → ниже" }
    ]
  },
  {
    id: "d",
    section: "B–E · Слоты (если не пакет)",
    title: "Слот 6 — каста разума",
    options: [
      { v: "d_skip", t: "— пропуск (взял пакет) —" },
      { v: "d1", t: "Хор Разума — цитадель свежевателей" },
      { v: "d2", t: "Шпиль Бездны — академия" },
      { v: "d3", t: "Сон Вентариуса — зона медитации императора" },
      { v: "d_other", t: "Своё → ниже" }
    ]
  },
  {
    id: "e",
    section: "B–E · Слоты (если не пакет)",
    title: "Слот 7 — восток / кусок подъёма",
    options: [
      { v: "e_skip", t: "— пропуск (взял пакет) —" },
      { v: "e1", t: "Осколок Востока — город на куске" },
      { v: "e2", t: "Край Пыли — форпост периферии" },
      { v: "e3", t: "Зеркальная Гавань — малый парящий порт" },
      { v: "e_other", t: "Своё → ниже" }
    ]
  },
  {
    id: "f",
    section: "F · Разлом",
    title: "Город у Разлома?",
    ctx: "Сейчас только подпись Разлома, далеко от Форта.",
    options: [
      { v: "f_none", t: "Только Разлом — без города рядом" },
      { v: "f_watch", t: "Добавить форпост у Разлома (+1 точка)" },
      { v: "f_other", t: "Другое → ниже" }
    ]
  }
];

function bySection(list) {
  const map = new Map();
  list.forEach((q) => {
    if (!map.has(q.section)) map.set(q.section, []);
    map.get(q.section).push(q);
  });
  return map;
}

function showNote(v) {
  return (v || "").endsWith("_other") || (v || "").endsWith("_edit") || (v || "").endsWith("_propose");
}

function render() {
  const root = document.getElementById("sections");
  root.innerHTML = "";
  bySection(QUESTIONS).forEach((qs, section) => {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${section}</h2>`;
    qs.forEach((q) => {
      const div = document.createElement("div");
      div.className = "q";
      const opts = q.options.map((o) => `<option value="${o.v}">${o.t}</option>`).join("");
      div.innerHTML = `
        <span class="title">${q.title}</span>
        <div class="ctx">${q.ctx || ""}</div>
        ${q.rec ? `<div class="rec">${q.rec}</div>` : ""}
        <select data-q="${q.id}"><option value="">— выбери —</option>${opts}</select>
        <textarea class="note" data-note="${q.id}" rows="3" placeholder="Уточнение…"></textarea>`;
      sec.appendChild(div);
    });
    root.appendChild(sec);
  });
  root.querySelectorAll("select").forEach((sel) => {
    sel.addEventListener("change", () => {
      const note = root.querySelector(`textarea[data-note="${sel.dataset.q}"]`);
      if (note) note.classList.toggle("show", showNote(sel.value));
      persist(); updateProgress();
    });
  });
  root.querySelectorAll("textarea.note").forEach((t) => t.addEventListener("input", persist));
  document.getElementById("freeform").addEventListener("input", persist);
}

function collect() {
  const lines = ["survey-mq06-dust-map-points"];
  QUESTIONS.forEach((q) => {
    const sel = document.querySelector(`select[data-q="${q.id}"]`);
    const note = document.querySelector(`textarea[data-note="${q.id}"]`);
    lines.push(`${q.id}=${sel?.value || "—"}`);
    if (note && note.value.trim()) lines.push(`${q.id}_note=${note.value.trim()}`);
  });
  lines.push("note=" + (document.getElementById("freeform").value.trim() || "—"));
  return lines.join("\n");
}

function persist() {
  const answers = {};
  QUESTIONS.forEach((q) => {
    const sel = document.querySelector(`select[data-q="${q.id}"]`);
    const note = document.querySelector(`textarea[data-note="${q.id}"]`);
    answers[q.id] = { v: sel?.value || "", note: note?.value || "" };
  });
  localStorage.setItem(STORAGE, JSON.stringify({
    answers, free: document.getElementById("freeform").value
  }));
}

function restore() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE) || "null");
    if (!data) return;
    QUESTIONS.forEach((q) => {
      const a = data.answers?.[q.id];
      if (!a) return;
      const sel = document.querySelector(`select[data-q="${q.id}"]`);
      const note = document.querySelector(`textarea[data-note="${q.id}"]`);
      if (sel) sel.value = a.v || "";
      if (note) {
        note.value = a.note || "";
        note.classList.toggle("show", showNote(a.v));
      }
    });
    if (data.free) document.getElementById("freeform").value = data.free;
  } catch (_) {}
  updateProgress();
}

function updateProgress() {
  let done = 0;
  QUESTIONS.forEach((q) => {
    const sel = document.querySelector(`select[data-q="${q.id}"]`);
    if (sel && sel.value) done++;
  });
  document.getElementById("count").textContent = `${done} / ${QUESTIONS.length}`;
  document.getElementById("bar").style.width = `${(done / QUESTIONS.length) * 100}%`;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 1600);
}

document.getElementById("btnCopy").addEventListener("click", async () => {
  const text = collect();
  const out = document.getElementById("out");
  out.textContent = text;
  out.classList.add("show");
  try {
    await navigator.clipboard.writeText(text);
    toast("Скопировано — вставь в чат");
  } catch (_) {
    toast("Выдели текст ниже");
  }
});

document.getElementById("btnLitter").addEventListener("click", async () => {
  const text = collect();
  const blob = new Blob([text], { type: "text/plain" });
  const fd = new FormData();
  fd.append("reqtype", "fileupload");
  fd.append("time", "72h");
  fd.append("fileToUpload", blob, "mq06-dust-map-points-answers.txt");
  try {
    const res = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", { method: "POST", body: fd });
    const url = await res.text();
    const out = document.getElementById("out");
    out.textContent = text + "\n\n# litterbox\n" + url;
    out.classList.add("show");
    try { await navigator.clipboard.writeText(url); } catch (_) {}
    toast("Litterbox ответов готов");
  } catch (_) {
    toast("Litterbox недоступен");
  }
});

render();
restore();
updateProgress();
</script>
</body>
</html>
