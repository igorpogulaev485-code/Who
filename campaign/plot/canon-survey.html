<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Опросник канона — Эхо рассвета</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f2f3f5;
    --muted: #9aa3b2;
    --line: #2a303b;
    --accent: #5b8cff;
    --accent-press: #3d6fe0;
    --ok: #3d9a6a;
    --pad: max(16px, env(safe-area-inset-left));
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #14171c;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #2563eb;
      --accent-press: #1d4ed8;
      --ok: #15803d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4; }
  main { max-width: 640px; margin: 0 auto; padding: 20px var(--pad) 120px; }
  h1 { font-size: 1.45rem; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 0; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin: 0 0 14px; }
  section h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }
  .q { padding: 12px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 0; }
  .q label.title { display: block; font-weight: 600; margin-bottom: 8px; }
  select, textarea, input[type=text] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    -webkit-appearance: none; appearance: none;
  }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
    background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .note { margin-top: 8px; display: none; }
  .note.show { display: block; }
  .footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  }
  .footer-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  button {
    flex: 1; border: 0; border-radius: 12px; padding: 14px 12px; font: inherit;
    font-weight: 600; color: #fff; background: var(--accent);
  }
  button:active { background: var(--accent-press); }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #toast {
    display: none; position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--ok); color: #fff; padding: 10px 14px; border-radius: 999px;
    font-size: 0.9rem; z-index: 20; white-space: nowrap;
  }
  #out {
    display: none; white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; font-size: 0.85rem; margin-top: 12px;
  }
  #out.show { display: block; }
</style>

<body>
<main>
  <h1>Опросник канона</h1>
  <p class="lead">Эхо рассвета. Выбери варианты пальцем. В конце — «Скопировать ответы» и вставь в чат Cursor.</p>

  <div class="progress">
    <div class="bar"><span id="bar"></span></div>
    <div class="meta"><span id="count">0 / 0</span><span>сохраняется на устройстве</span></div>
  </div>

  <div id="sections"></div>

  <section>
    <h2>Свободный текст</h2>
    <p class="hint">На чём остановились и что планируешь — сюда.</p>
    <textarea id="freeform" rows="7" placeholder="Последняя сцена / город / квест. План на 1–3 сессии. Факты, которых не было в шарингах."></textarea>
  </section>

  <pre id="out"></pre>
</main>

<div class="footer">
  <div class="footer-inner">
    <button class="secondary" type="button" id="btnClear">Сброс</button>
    <button type="button" id="btnCopy">Скопировать ответы</button>
  </div>
</div>
<div id="toast">Скопировано — вставь в чат Cursor</div>

const KEY = "echo-dawn-canon-survey-v1";
const NOTE_TRIGGERS = new Set(["other","changed","some","new_name","between","sheet_wrong"]);

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
}
function save(state) {
  localStorage.setItem(KEY, JSON.stringify(state));
}

const state = Object.assign({ answers: {}, notes: {}, freeform: "" }, load());
const root = document.getElementById("sections");
let total = 0;

SECTIONS.forEach((section) => {
  const el = document.createElement("section");
  el.innerHTML = `<h2>${section.title}</h2>` + (section.hint ? `<p class="hint">${section.hint}</p>` : "");
  section.questions.forEach((q) => {
    total += 1;
    const wrap = document.createElement("div");
    wrap.className = "q";
    wrap.dataset.id = q.id;
    const opts = q.options.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
    wrap.innerHTML = `
      <label class="title" for="${q.id}">${q.label}</label>
      <select id="${q.id}"><option value="">Выбери…</option>${opts}</select>
      <input class="note" type="text" id="note-${q.id}" placeholder="Свой ответ / уточнение…" />
    `;
    el.appendChild(wrap);
    const sel = wrap.querySelector("select");
    const note = wrap.querySelector(".note");
    sel.value = state.answers[q.id] || "";
    note.value = state.notes[q.id] || "";
    const syncNote = () => {
      note.classList.toggle("show", NOTE_TRIGGERS.has(sel.value) || !!note.value);
    };
    syncNote();
    sel.addEventListener("change", () => {
      state.answers[q.id] = sel.value;
      syncNote();
      persist();
    });
    note.addEventListener("input", () => {
      state.notes[q.id] = note.value;
      syncNote();
      persist();
    });
  });
  root.appendChild(el);
});

const free = document.getElementById("freeform");
free.value = state.freeform || "";
free.addEventListener("input", () => { state.freeform = free.value; persist(); });

function answeredCount() {
  return Object.values(state.answers).filter(Boolean).length;
}
function persist() {
  save(state);
  const n = answeredCount();
  document.getElementById("count").textContent = `${n} / ${total}`;
  document.getElementById("bar").style.width = `${Math.round((n / total) * 100)}%`;
}
persist();

function format() {
  const lines = ["Ответы на опросник канона «Эхо рассвета»:", ""];
  SECTIONS.forEach((section) => {
    lines.push("## " + section.title);
    section.questions.forEach((q) => {
      const val = state.answers[q.id] || "";
      const label = (q.options.find(([v]) => v === val) || [,"—"])[1];
      const note = (state.notes[q.id] || "").trim();
      lines.push(`- ${q.label}: ${label}${note ? " | уточнение: " + note : ""}`);
    });
    lines.push("");
  });
  if ((state.freeform || "").trim()) {
    lines.push("## Свободный текст");
    lines.push(state.freeform.trim());
  }
  return lines.join("\n");
}

function toast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2200);
}

document.getElementById("btnCopy").addEventListener("click", async () => {
  const text = format();
  const out = document.getElementById("out");
  out.textContent = text;
  out.classList.add("show");
  try {
    await navigator.clipboard.writeText(text);
    toast();
  } catch {
    // iOS fallback: select text
    const range = document.createRange();
    range.selectNodeContents(out);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    alert("Выделил текст ниже — скопируй и вставь в Cursor");
  }
});

document.getElementById("btnClear").addEventListener("click", () => {
  if (!confirm("Сбросить все ответы?")) return;
  state.answers = {}; state.notes = {}; state.freeform = "";
  save(state);
  location.reload();
});
