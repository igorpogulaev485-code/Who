<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <title>08 - Взорванная сборка</title>
  <rect width="1000" height="700" fill="#f5f2eb"/>
  <text x="40" y="36" font-size="22" font-weight="700">08 - Сборка (взорванный вид)</text>
  <text x="40" y="58" font-size="13" fill="#555">Порядок снизу вверх; см. также 05-assembly.md</text>
  <g transform="translate(200,80)" opacity="0.95">
    <rect x="40" y="0" width="400" height="28" fill="#e8d5b5" stroke="#5c4030" stroke-width="1.5" transform="skewX(-20)"/>
    <text x="520" y="20" font-size="13" fill="#333">8. Топпер T1-T3</text>
    <rect x="-30" y="50" width="80" height="40" fill="#d4b896" stroke="#5c4030" stroke-width="1" transform="skewX(-20)"/>
    <rect x="450" y="50" width="60" height="50" fill="#e8d5b5" stroke="#5c4030" stroke-width="1" transform="skewX(-20)"/>
    <text x="520" y="75" font-size="13" fill="#333">7. Накладки (DM + игроки)</text>
    <rect x="20" y="110" width="440" height="36" fill="#c4a574" stroke="#5c4030" stroke-width="1.5" transform="skewX(-20)"/>
    <text x="520" y="135" font-size="13" fill="#333">6. Рейка + полка (ledge)</text>
    <rect x="60" y="165" width="360" height="14" fill="#2a4a4a" stroke="#1a2a2a" stroke-width="1" transform="skewX(-20)"/>
    <text x="520" y="178" font-size="13" fill="#333">5. Сукно / неопрен</text>
    <rect x="60" y="195" width="360" height="16" fill="#a08060" stroke="#5c4030" stroke-width="1" transform="skewX(-20)"/>
    <text x="520" y="210" font-size="13" fill="#333">4. Дно ниши 12 мм</text>
    <rect x="40" y="230" width="400" height="40" fill="#b8956a" stroke="#5c4030" stroke-width="1.5" transform="skewX(-20)"/>
    <text x="520" y="255" font-size="13" fill="#333">3. Стенки ниши + царги</text>
    <rect x="50" y="290" width="30" height="100" fill="#8b7355" stroke="#5c4030" stroke-width="1"/>
    <rect x="380" y="290" width="30" height="100" fill="#8b7355" stroke="#5c4030" stroke-width="1"/>
    <rect x="60" y="280" width="340" height="20" fill="#9a8060" stroke="#5c4030" stroke-width="1" transform="skewX(-20)"/>
    <text x="520" y="340" font-size="13" fill="#333">2. Ножки + нижняя обвязка</text>
    <line x1="0" y1="420" x2="450" y2="420" stroke="#bbb" stroke-dasharray="6 4"/>
    <text x="520" y="425" font-size="13" fill="#777">1. Пол / место установки</text>
  </g>
  <g transform="translate(40,540)">
    <text font-size="13" font-weight="600">Критический порядок</text>
    <text y="22" font-size="12" fill="#444">Каркас в квадрат - дно - сукно - рейка с полкой в одной плоскости - топпер по факту - накладки.</text>
    <text y="44" font-size="12" fill="#444">Финиш (масло/лак) - до оклейки сукном и до установки подстаканников.</text>
    <text y="66" font-size="12" fill="#444">Полная инструкция: 05-assembly.md</text>
  </g>
</svg>
