<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, sans-serif">
  <title>06 - Съёмный топпер</title>
  <rect width="1000" height="620" fill="#f5f2eb"/>
  <text x="40" y="36" font-size="22" font-weight="700">06 - Съёмный верхний стол (топпер)</text>
  <text x="40" y="58" font-size="13" fill="#555">3 панели 18 мм; лежат на полке; заподлицо с рейкой</text>
  <g transform="translate(80,100)">
    <rect x="0" y="0" width="840" height="400" fill="none" stroke="#c4a574" stroke-width="20" opacity="0.4"/>
    <rect x="20" y="20" width="800" height="360" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="30" y="30" width="250" height="340" fill="#e8d5b5" stroke="#5c4030" stroke-width="2"/>
    <rect x="295" y="30" width="250" height="340" fill="#e8d5b5" stroke="#5c4030" stroke-width="2"/>
    <rect x="560" y="30" width="250" height="340" fill="#e8d5b5" stroke="#5c4030" stroke-width="2"/>
    <text x="155" y="200" font-size="14" text-anchor="middle" fill="#3d2b1f" font-weight="600">T1 мастер</text>
    <text x="155" y="220" font-size="12" text-anchor="middle" fill="#555">~598 x 736</text>
    <text x="420" y="200" font-size="14" text-anchor="middle" fill="#3d2b1f" font-weight="600">T2 центр</text>
    <text x="420" y="220" font-size="12" text-anchor="middle" fill="#555">~598 x 736</text>
    <text x="685" y="200" font-size="14" text-anchor="middle" fill="#3d2b1f" font-weight="600">T3 дальняя</text>
    <text x="685" y="220" font-size="12" text-anchor="middle" fill="#555">~598 x 736</text>
    <circle cx="285" cy="100" r="5" fill="#888"/>
    <circle cx="285" cy="200" r="5" fill="#888"/>
    <circle cx="285" cy="300" r="5" fill="#888"/>
    <circle cx="550" cy="100" r="5" fill="#888"/>
    <circle cx="550" cy="200" r="5" fill="#888"/>
    <circle cx="550" cy="300" r="5" fill="#888"/>
    <text x="420" y="390" font-size="11" text-anchor="middle" fill="#666">шканты D8 между панелями (3 на стык)</text>
    <line x1="30" y1="420" x2="280" y2="420" stroke="#333"/>
    <text x="155" y="438" font-size="12" text-anchor="middle">~598</text>
    <line x1="860" y1="30" x2="860" y2="370" stroke="#333"/>
    <text x="880" y="200" font-size="12" font-weight="600">~736</text>
  </g>
  <g transform="translate(40,560)">
    <text font-size="12" fill="#444">Свет ниши 1800x700 - панели с зазором 2 мм по периметру и 2-3 мм на стыках.</text>
    <text y="20" font-size="12" fill="#444">Уточнить размеры после сборки каркаса - снять фактический проём.</text>
    <text y="40" font-size="12" fill="#444">Опционально: гравировка герба кампании на T2.</text>
  </g>
</svg>
