<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Arial, sans-serif">
  <title>05 - Лоток и башня кубов</title>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#f5f2eb"/>
  <text x="40" y="36" font-size="22" font-weight="700">05 - Кубы: лоток и башня</text>
  <text x="40" y="58" font-size="13" fill="#555">Этап 1 - механика без электроники; куб выкатывается гранью вверх</text>
  <g transform="translate(60,100)">
    <text x="0" y="-12" font-size="15" font-weight="600">А. Мягкий лоток (базовый)</text>
    <rect x="0" y="0" width="250" height="180" fill="#2a4a4a" stroke="#5c4030" stroke-width="2" rx="4"/>
    <rect x="0" y="0" width="250" height="180" fill="none" stroke="#c4a574" stroke-width="10" rx="4" opacity="0.5"/>
    <rect x="8" y="8" width="234" height="164" fill="#2a4a4a" rx="2"/>
    <text x="125" y="90" font-size="12" text-anchor="middle" fill="#cde">неопрен</text>
    <rect x="100" y="110" width="28" height="28" rx="3" fill="#eee" transform="rotate(15 114 124)"/>
    <text x="118" y="128" font-size="10" text-anchor="middle" fill="#333">6</text>
    <line x1="0" y1="200" x2="250" y2="200" stroke="#333"/>
    <text x="125" y="218" font-size="12" text-anchor="middle">250 x 180 x борт 45</text>
    <text x="0" y="245" font-size="12" fill="#444">Навешивается клитом или стоит на рейке.</text>
    <text x="0" y="265" font-size="12" fill="#444">Куб не улетает, грань читается.</text>
  </g>
  <g transform="translate(400,90)">
    <text x="0" y="-12" font-size="15" font-weight="600">Б. Башня мастера (опционально)</text>
    <rect x="80" y="20" width="70" height="220" fill="#c4a574" stroke="#5c4030" stroke-width="2"/>
    <line x1="80" y1="70" x2="130" y2="90" stroke="#5c4030" stroke-width="3"/>
    <line x1="100" y1="120" x2="150" y2="140" stroke="#5c4030" stroke-width="3"/>
    <line x1="80" y1="170" x2="130" y2="190" stroke="#5c4030" stroke-width="3"/>
    <path d="M70,20 L160,20 L145,5 L85,5 Z" fill="#b8956a" stroke="#5c4030" stroke-width="1.5"/>
    <text x="115" y="-5" font-size="11" text-anchor="middle">вход куба</text>
    <rect x="40" y="240" width="150" height="50" fill="#2a4a4a" stroke="#5c4030" stroke-width="2" rx="3"/>
    <rect x="100" y="255" width="24" height="24" rx="2" fill="#eee"/>
    <text x="112" y="272" font-size="10" text-anchor="middle" fill="#333">4</text>
    <text x="115" y="310" font-size="12" text-anchor="middle">смотровой лоток</text>
    <path d="M115,30 L115,55" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="170" y="100" font-size="11" fill="#c0392b">перекаты по полкам</text>
    <text x="170" y="120" font-size="11" fill="#c0392b">выпадает гранью вверх</text>
    <text x="0" y="350" font-size="12" fill="#444">Внутренние полки под ~35-40 град.</text>
    <text x="0" y="370" font-size="12" fill="#444">Высота башни ~280-320 мм.</text>
    <text x="0" y="390" font-size="12" fill="#444">Крепится к рейке мастера или стоит</text>
    <text x="0" y="410" font-size="12" fill="#444">отдельно на станции DM.</text>
  </g>
  <g transform="translate(60,480)">
    <rect width="880" height="180" rx="6" fill="#eee8dc" stroke="#c4a574" stroke-width="1"/>
    <text x="20" y="30" font-size="14" font-weight="600">Этап 2 (не в базовой смете) - авточтение значений</text>
    <text x="20" y="55" font-size="12" fill="#444">Камера над смотровым лотком + приложение OCR или готовый электронный трей.</text>
    <text x="20" y="78" font-size="12" fill="#444">В каркас стола ничего не встраиваем: нет ТВ, нет скрытой проводки под кубы.</text>
    <text x="20" y="101" font-size="12" fill="#444">Питание - USB power bank или удлинитель у ноги мастера.</text>
    <text x="20" y="130" font-size="12" fill="#333" font-weight="600">Рекомендация:</text>
    <text x="130" y="130" font-size="12" fill="#444">сначала лоток + башня; электронику - только если реально не хватает.</text>
    <text x="20" y="155" font-size="12" fill="#444">В DIY "выдают значения" = башня выкатывает куб в лоток лицом вверх.</text>
  </g>
</svg>
