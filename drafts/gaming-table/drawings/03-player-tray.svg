<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <title>03 - Мини-столик игрока</title>
  <rect width="900" height="700" fill="#f5f2eb"/>
  <text x="40" y="36" font-size="22" font-weight="700">03 - Накладной мини-столик игрока</text>
  <text x="40" y="58" font-size="13" fill="#555">380 x 300 x 18 мм; слот гаджета; карман; подстаканник; клит</text>
  <g transform="translate(80,100)">
    <text x="0" y="-10" font-size="14" font-weight="600">Вид сверху</text>
    <rect x="0" y="0" width="380" height="300" fill="#e8d5b5" stroke="#5c4030" stroke-width="2" rx="3"/>
    <rect x="20" y="40" width="210" height="240" fill="none" stroke="#4a90a4" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="125" y="165" font-size="12" text-anchor="middle" fill="#4a90a4">зона A4</text>
    <text x="125" y="182" font-size="10" text-anchor="middle" fill="#4a90a4">210 x 297</text>
    <rect x="250" y="40" width="110" height="8" fill="#3d2b1f" rx="1"/>
    <text x="305" y="30" font-size="11" text-anchor="middle" fill="#333">слот 8x120</text>
    <rect x="250" y="70" width="80" height="80" fill="#c4b090" stroke="#5c4030" stroke-width="1" rx="2"/>
    <text x="290" y="115" font-size="11" text-anchor="middle" fill="#333">карман</text>
    <text x="290" y="130" font-size="10" text-anchor="middle" fill="#555">80x80x15</text>
    <circle cx="305" cy="230" r="42" fill="none" stroke="#888" stroke-width="3"/>
    <circle cx="305" cy="230" r="36" fill="#c0c0c0" stroke="#666" stroke-width="1"/>
    <circle cx="305" cy="230" r="28" fill="#f5f2eb"/>
    <text x="305" y="285" font-size="11" text-anchor="middle" fill="#333">D90-95 нерж.</text>
    <line x1="0" y1="320" x2="380" y2="320" stroke="#333"/>
    <text x="190" y="338" font-size="13" text-anchor="middle" font-weight="600">380</text>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#333"/>
    <text x="418" y="150" font-size="13" font-weight="600">300</text>
  </g>
  <g transform="translate(80,500)">
    <text x="0" y="-10" font-size="14" font-weight="600">Вид сбоку - клит на рейке</text>
    <rect x="100" y="0" width="80" height="28" fill="#c4a574" stroke="#5c4030" stroke-width="1.5"/>
    <text x="140" y="-4" font-size="10" text-anchor="middle" fill="#555">рейка стола</text>
    <rect x="60" y="-2" width="160" height="14" fill="#e8d5b5" stroke="#5c4030" stroke-width="1.5"/>
    <path d="M175,12 L175,40 L95,40 L95,12 L108,12 L108,28 L162,28 L162,12 Z" fill="#d4b896" stroke="#c0392b" stroke-width="1.5"/>
    <text x="200" y="35" font-size="11" fill="#c0392b">клит (крюк)</text>
    <text x="60" y="70" font-size="11" fill="#444">Накладка снимается вверх-наружу. Без винтов в каркас.</text>
  </g>
  <text x="520" y="120" font-size="13" fill="#333">Комплект: x8 шт.</text>
  <text x="520" y="145" font-size="12" fill="#555">При 3 игроках - вешаем 3.</text>
  <text x="520" y="168" font-size="12" fill="#555">Фреза: паз слота, карман,</text>
  <text x="520" y="188" font-size="12" fill="#555">отверстие подстаканника</text>
  <text x="520" y="208" font-size="12" fill="#555">коронкой D93-95.</text>
</svg>
