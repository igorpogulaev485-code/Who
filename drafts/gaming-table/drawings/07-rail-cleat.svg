<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Arial, sans-serif">
  <title>07 - Узел клита</title>
  <rect width="900" height="580" fill="#f5f2eb"/>
  <text x="40" y="36" font-size="22" font-weight="700">07 - Узел крепления накладки (клит)</text>
  <text x="40" y="58" font-size="13" fill="#555">Профиль рейки и крюка; без винтов в каркас</text>
  <g transform="translate(80,120)">
    <rect x="200" y="80" width="160" height="70" fill="#c4a574" stroke="#5c4030" stroke-width="2"/>
    <text x="280" y="120" font-size="13" text-anchor="middle" fill="#3d2b1f">рейка</text>
    <text x="280" y="138" font-size="11" text-anchor="middle" fill="#555">толщина пакета ~40</text>
    <rect x="80" y="78" width="320" height="22" fill="#e8d5b5" stroke="#5c4030" stroke-width="2"/>
    <text x="140" y="94" font-size="11" fill="#3d2b1f">накладка 18</text>
    <path d="M300,100 L300,175 L200,175 L200,100 L220,100 L220,155 L280,155 L280,100 Z" fill="#d4b896" stroke="#c0392b" stroke-width="2"/>
    <text x="250" y="195" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="600">клит</text>
    <line x1="200" y1="100" x2="200" y2="155" stroke="#333" stroke-width="1"/>
    <text x="185" y="130" font-size="11" text-anchor="end">зазор 1-2</text>
    <line x1="220" y1="175" x2="280" y2="175" stroke="#333"/>
    <text x="250" y="215" font-size="11" text-anchor="middle">захват от 45 мм по глубине</text>
    <line x1="380" y1="80" x2="380" y2="150" stroke="#333"/>
    <text x="400" y="120" font-size="12">~40</text>
    <line x1="200" y1="50" x2="360" y2="50" stroke="#333"/>
    <text x="280" y="42" font-size="12" text-anchor="middle">ширина рейки 200 (у мастера 350)</text>
  </g>
  <g transform="translate(80,400)">
    <text font-size="14" font-weight="600">Изготовление клита</text>
    <text y="24" font-size="12" fill="#444">1. Две полосы фанеры 18 мм: горизонтальная полка + вертикальная губа.</text>
    <text y="46" font-size="12" fill="#444">2. Склеить / стянуть конфирматами в П-профиль под толщину рейки + 1-2 мм.</text>
    <text y="68" font-size="12" fill="#444">3. Прикрутить снизу к накладке (винты 4x30 снизу вверх, потай).</text>
    <text y="90" font-size="12" fill="#444">4. Войлочные наклейки внутри клита - не царапает рейку.</text>
    <text y="112" font-size="12" fill="#444">Альтернатива: алюминиевый C-профиль - дороже, тоньше, долговечнее.</text>
  </g>
</svg>
