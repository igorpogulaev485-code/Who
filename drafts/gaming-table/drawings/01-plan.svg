    <rect x="160" width="14" height="14" fill="#2a4a4a"/>
    <text x="182" y="12" font-size="12" fill="#333">ниша + сукно</text>
    <rect x="320" width="14" height="14" fill="#e8d5b5" stroke="#5c4030"/>
