<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">
  <title>01 - План сверху</title>
  <defs>
    <pattern id="felt" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2a4a4a"/>
      <circle cx="2" cy="2" r="0.6" fill="#355555"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#f5f2eb"/>
  <text x="40" y="36" font-size="22" font-weight="700" fill="#1a1a1a">01 - План сверху (масштаб ~1:20)</text>
  <text x="40" y="58" font-size="13" fill="#555">Габарит 2200 x 1100 мм; ниша 1800 x 700; зона мастера слева</text>
  <g transform="translate(160,120)">
    <rect x="0" y="0" width="880" height="440" fill="#c4a574" stroke="#5c4030" stroke-width="2"/>
    <rect x="140" y="80" width="720" height="280" fill="url(#felt)" stroke="#3d2b1f" stroke-width="1.5"/>
    <rect x="136" y="76" width="728" height="288" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="140" y1="390" x2="860" y2="390" stroke="#333" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="500" y="408" font-size="12" text-anchor="middle" fill="#222">1800</text>
    <line x1="900" y1="80" x2="900" y2="360" stroke="#333" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="920" y="230" font-size="12" text-anchor="middle" fill="#222" transform="rotate(90 920 230)">700</text>
    <line x1="0" y1="-30" x2="880" y2="-30" stroke="#333" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="440" y="-38" font-size="13" text-anchor="middle" font-weight="600">2200</text>
    <line x1="-40" y1="0" x2="-40" y2="440" stroke="#333" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-52" y="220" font-size="13" text-anchor="middle" font-weight="600" transform="rotate(-90 -52 220)">1100</text>
    <text x="70" y="230" font-size="11" text-anchor="middle" fill="#3d2b1f" font-weight="600" transform="rotate(-90 70 230)">МАСТЕР 350</text>
    <text x="440" y="45" font-size="11" text-anchor="middle" fill="#3d2b1f">рейка 200</text>
    <text x="440" y="420" font-size="11" text-anchor="middle" fill="#3d2b1f">рейка 200</text>
    <text x="820" y="230" font-size="11" text-anchor="middle" fill="#3d2b1f" transform="rotate(90 820 230)">рейка 200</text>
    <g fill="#e8d5b5" stroke="#5c4030" stroke-width="1">
      <rect x="200" y="-55" width="120" height="55" rx="2"/>
      <rect x="380" y="-55" width="120" height="55" rx="2"/>
      <rect x="560" y="-55" width="120" height="55" rx="2"/>
      <rect x="200" y="440" width="120" height="55" rx="2"/>
      <rect x="380" y="440" width="120" height="55" rx="2"/>
      <rect x="560" y="440" width="120" height="55" rx="2"/>
      <rect x="880" y="100" width="55" height="100" rx="2"/>
      <rect x="880" y="240" width="55" height="100" rx="2"/>
    </g>
    <rect x="-70" y="120" width="70" height="200" rx="2" fill="#d4b896" stroke="#5c4030" stroke-width="1.5"/>
    <text x="-35" y="230" font-size="10" text-anchor="middle" fill="#3d2b1f" transform="rotate(-90 -35 230)">DM tray</text>
    <g fill="none" stroke="#888" stroke-width="1">
      <circle cx="230" cy="-28" r="8"/><circle cx="410" cy="-28" r="8"/><circle cx="590" cy="-28" r="8"/>
      <circle cx="230" cy="468" r="8"/><circle cx="410" cy="468" r="8"/><circle cx="590" cy="468" r="8"/>
    </g>
    <rect x="20" y="160" width="90" height="60" rx="3" fill="#2c2c2c" opacity="0.85"/>
    <text x="65" y="195" font-size="9" text-anchor="middle" fill="#eee">ноутбук</text>
    <rect x="25" y="100" width="80" height="8" fill="#4a3728"/>
