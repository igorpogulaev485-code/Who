    <line x1="700" y1="7" x2="740" y2="7" stroke="#8b6914" stroke-dasharray="4 3"/>
    <text x="750" y="12" font-size="12" fill="#333">полка под топпер</text>
  </g>
  <text x="40" y="670" font-size="11" fill="#777">Эхо рассвета - drafts/gaming-table - размеры мм</text>
