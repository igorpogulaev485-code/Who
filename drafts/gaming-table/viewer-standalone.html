<script>
const panels=[...document.querySelectorAll('.panel')];
const buttons=[...document.querySelectorAll('nav button')];
let cur=0;
function show(i){
  cur=i;
  panels.forEach((p,idx)=>p.hidden=idx!==i);
  buttons.forEach((b,idx)=>b.setAttribute('aria-current', idx===i?'true':'false'));
}
buttons.forEach(b=>b.addEventListener('click',()=>show(+b.dataset.i)));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show((cur+1)%panels.length);
  if(e.key==='ArrowLeft') show((cur-1+panels.length)%panels.length);
});
show(0);
</script>
